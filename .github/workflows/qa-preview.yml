name: QA Preview

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL raiz do Vercel Preview a validar
        required: true
        type: string
      suite:
        description: Conjunto de testes a executar
        required: true
        default: full
        type: choice
        options:
          - full
          - spreadsheet

permissions:
  contents: read

concurrency:
  group: qa-preview-doze52
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke E2E no DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      QA_BASE_URL: ${{ inputs.base_url }}
      QA_ALLOWED_ORIGIN_PATTERN: ${{ vars.QA_ALLOWED_ORIGIN_PATTERN }}
      QA_SUPABASE_PROJECT_REF: ${{ vars.QA_SUPABASE_PROJECT_REF }}
      QA_E2E_EMAIL: ${{ vars.QA_E2E_EMAIL }}
      SUPABASE_DEV_URL: ${{ vars.SUPABASE_DEV_URL }}
      SUPABASE_DEV_ANON_KEY: ${{ vars.SUPABASE_DEV_ANON_KEY }}
      QA_SUITE: ${{ github.event.inputs.suite }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validar configuracao obrigatoria
        shell: bash
        run: |
          set -euo pipefail
          required=(
            QA_BASE_URL
            QA_ALLOWED_ORIGIN_PATTERN
            QA_SUPABASE_PROJECT_REF
            QA_E2E_EMAIL
            SUPABASE_DEV_URL
            SUPABASE_DEV_ANON_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Configuracao obrigatoria ausente: ${name}." >&2
              exit 1
            fi
          done

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Confirmar Preview e Supabase DEV
        run: npm run qa:validate:dev

      - name: Limpar conta E2E antes do smoke
        env:
          QA_E2E_PASSWORD: ${{ secrets.QA_E2E_PASSWORD }}
        run: npm run qa:reset:dev

      - name: Executar smoke
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          QA_E2E_PASSWORD: ${{ secrets.QA_E2E_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [[ -z "$QA_E2E_PASSWORD" || -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]]; then
            echo "Secrets obrigatorios de QA ausentes." >&2
            exit 1
          fi
          if [[ "$QA_SUITE" == "spreadsheet" ]]; then
            npx playwright test tests/e2e/auth.setup.ts --project=setup-desktop
            npx playwright test \
              tests/e2e/calendar-spreadsheet.download.spec.ts \
              --project=desktop-chromium \
              --no-deps
            npx playwright test tests/e2e/auth.mobile.setup.ts \
              --project=setup-mobile \
              --no-deps
            npx playwright test tests/e2e/mobile.smoke.spec.ts \
              --project=mobile-chromium \
              --no-deps
          else
            npm run qa:smoke
          fi

      - name: Limpar conta E2E depois do smoke
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          QA_E2E_PASSWORD: ${{ secrets.QA_E2E_PASSWORD }}
        run: npm run qa:reset:dev

      - name: Publicar evidencias da falha
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-preview-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Consolidar resultado
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.smoke.outcome }}" != "success" ]]; then
            echo "O smoke E2E falhou." >&2
            exit 1
          fi
          if [[ "${{ steps.cleanup.outcome }}" != "success" ]]; then
            echo "A limpeza final da conta E2E falhou." >&2
            exit 1
          fi
